name: Publish Windows Release

on:
  push:
    # 只要您在本地打了形如 v1.0.0 的标签并 push，就会触发这个流水线
    tags:
      - 'v*.*.*'

# 赋予流水线自动发版的写入权限
permissions:
  contents: write

jobs:
  release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🔨 Build Windows App
        # 这一步会执行我们 package.json 里的打包命令生成 exe
        # GH_TOKEN 是 electron-builder 内部 GitHub Publisher 所需的认证 token
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # release 正文 = 仓库根的 RELEASE_NOTES.md（electron-updater 取此文本作为 releaseNotes，
          # 显示在应用的「发现新版本」弹窗里）。每次发版前更新此文件。
          body_path: RELEASE_NOTES.md
          # 在自定义正文之后追加 GitHub 自动生成的 commit/PR changelog
          generate_release_notes: true
          # 提取打包出来的所有 exe、zip 以及必须的 latest.yml 给更新服务使用
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
